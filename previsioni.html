<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Previsioni Meteo Venezia — LagunaLive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="previsioni.css">
</head>
<body>

<!-- FASCIA 1 — Titolo, luogo, situazione attuale -->
<header class="prvs-fascia prvs-fascia-header">
    <h1>Previsioni Meteo</h1>
    <div class="prvs-luogo">Venezia — Centro Storico</div>
    <div id="prvs-attuale" class="prvs-attuale">
        <span class="prvs-attuale-caricamento">Caricamento situazione attuale…</span>
    </div>
</header>

<main>

    <!-- FASCIA 2 — Scroll orario di oggi -->
    <section class="prvs-fascia" id="prvs-fascia-oggi">
        <div class="prvs-label">Prossime ore</div>
        <div class="prvs-oraria-scroll" id="prvs-oggi-scroll">
            <span class="prvs-caricamento">Caricamento previsioni…</span>
        </div>
    </section>

    <!-- FASCIA 3 — Riepilogo giorni successivi (tap per dettaglio) -->
    <section class="prvs-fascia" id="prvs-fascia-giorni">
        <!-- Una .prvs-giorno-card per ogni giorno, generata da JS -->
    </section>

    <!-- FASCIA 4 — Link esterni -->
    <section class="prvs-fascia prvs-fascia-azioni">
        <div class="prvs-link-esterni">
            <a href="https://www.arpa.veneto.it/bollettini/meteo/h24/Venezia_Laguna.htm"
               target="_blank" rel="noopener" class="prvs-link-esterno">
                ARPAV — Meteo Venezia Laguna
            </a>
            <a href="https://www.comune.venezia.it/it/content/centro-previsioni-e-segnalazioni-maree"
               target="_blank" rel="noopener" class="prvs-link-esterno">
                Comune di Venezia — Previsioni marea
            </a>
        </div>
    </section>

</main>

<!-- MODAL DETTAGLIO GIORNO (struttura pronta, contenuto nel prossimo passo) -->
<div id="prvs-modal" class="prvs-modal-backdrop">
    <div class="prvs-modal">
        <div class="prvs-modal-header">
            <h3 id="prvs-modal-title">Dettaglio</h3>
            <span id="prvs-modal-close" class="prvs-modal-close">&times;</span>
        </div>
        <div id="prvs-modal-body">
            <!-- Tabella fasce/modelli: la costruiamo nel prossimo passo -->
        </div>
    </div>
</div>

<script src="previsioni-data.js"></script>
<script src="previsioni-render.js"></script>

</body>
</html>
