<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LagunaLive</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌊 LagunaLive</h1>

<div id="status">Caricamento...</div>

<div class="card">
    <h2>🌊 Marea</h2>
    <div class="value" id="tide">--</div>
    <div class="timestamp" id="tideTime"></div>
</div>

<div class="card">
    <h2>🌊 Temperatura acqua</h2>
    <div class="value" id="waterTemp">--</div>
</div>

<div class="card">
    <h2>🌡️ Temperatura</h2>
    <div class="value" id="temp">--</div>
    <div class="timestamp" id="airTime"></div>
</div>

<div class="card">
    <h2>💧 Umidità</h2>
    <div class="value" id="humidity">--</div>
</div>

<div class="card">
    <h2>💨 Vento</h2>
    <div class="value" id="wind">--</div>
</div>

<div class="card">
    <h2>📈 Pressione</h2>
    <div class="value" id="pressure">--</div>
</div>

<div class="card">
    <h2>📡 Stazioni</h2>
    <div id="stationsStatus">
        Caricamento...
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
