<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LagunaLive</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌊 LagunaLive</h1>

<div id="status">Caricamento...</div>

<!-- CARD 1: Temperatura -->
<div class="card">
    <h2>🌡️ Temperatura</h2>

    <div class="main-temp clickable" id="mainTempLink">
        <div class="main-temp-value" id="temp">--</div>
        <div class="main-temp-station" id="tempStation">Osservatorio Cavanis &middot; --</div>
    </div>

    <div class="sub-stations">
        <div class="sub-station clickable" id="subCavalli">Palazzo Cavalli: -- (--)</div>
        <div class="sub-station clickable" id="subSanGiorgio">San Giorgio: -- (--)</div>
    </div>
</div>

<!-- CARD 2: Umidità e percepita -->
<div class="card">
    <h2>💧 Umidità e temperatura percepita</h2>

    <div class="metric-block">
        <div class="metric-label">Umidità</div>
        <div class="metric-value" id="humidity">--</div>
    </div>

    <div class="metric-block">
        <div class="metric-label">Percepita</div>
        <div class="metric-value" id="heatIndex">--</div>
    </div>

    <div id="humidityDetails" class="details"></div>
</div>

<!-- CARD 3: Mare -->
<div class="card">
    <h2>🌊 Mare</h2>

    <div class="mare-main clickable" id="mareLink">
        <span class="mare-value" id="tide">--</span>
        <span class="mare-value" id="waterTemp">--</span>
    </div>

    <div id="tideTime" class="timestamp"></div>
    <div id="tideSource" class="timestamp"></div>
</div>

<!-- CARD 4: Vento, pioggia, pressione -->
<div class="card">
    <div class="metric-line">
        <span class="metric-name">Vento</span>
        <span class="metric-data" id="wind">--</span>
    </div>
    <div class="metric-line">
        <span class="metric-name">Pioggia</span>
        <span class="metric-data" id="rain">--</span>
    </div>
    <div class="metric-line">
        <span class="metric-name">Pressione</span>
        <span class="metric-data" id="pressure">--</span>
    </div>

    <div id="airTime" class="timestamp"></div>
</div>

<div class="card">
    <h2>📡 Stazioni utilizzate</h2>

    <div id="stationsStatus">
        Caricamento...
    </div>
</div>

<!-- Modale scheda stazione -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <button id="modalClose" class="modal-close" aria-label="Chiudi">✕</button>
        <h2 id="modalTitle">Stazione</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
