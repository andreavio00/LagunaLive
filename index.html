<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LagunaLive</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.value{
    font-size:32px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>🌊 LagunaLive</h1>

<div class="card">
    <h2>Marea</h2>
    <div class="value">-- cm</div>
</div>

<div class="card">
    <h2>Temperatura</h2>
    <div class="value">-- °C</div>
</div>

<div class="card">
    <h2>Umidità</h2>
    <div class="value">-- %</div>
</div>

<div class="card">
    <h2>Vento</h2>
    <div class="value">-- km/h</div>
</div>

<div class="card">
    <h2>Pressione</h2>
    <div class="value">-- hPa</div>
</div>

<div class="card">
    <h2>Temperatura Acqua</h2>
    <div class="value">-- °C</div>
</div>

</body>
</html>
